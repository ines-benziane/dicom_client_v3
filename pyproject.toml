[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myo-dicom"
version = "1.1.0"
description = "DICOM client — recherche, récupération et anonymisation/pseudonymisation depuis le PACS"
requires-python = ">=3.11"
authors = [
    { name = "Inès Benziane", email = "i.benziane@institut-myologie.org" },
]
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "click",
    "pynetdicom",
    "pydicom",
    "pandas",
    "openpyxl",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
dicom-client = "dicom.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dicom*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
